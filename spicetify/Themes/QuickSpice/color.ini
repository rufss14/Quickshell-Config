; QuickSpice colour slots.
;
; Spicetify has fifteen slots; the shell's palette has more roles than that. So the slots
; carry the five INPUTS and user.css derives every other role with color-mix(), the same
; blends config/PaletteRoles.qml uses. scripts/themes/spotify/pwspice.py rewrites the section below
; from ~/.cache/wal/colors.json whenever the shell's palette changes:
;
;   main sidebar player misc    base       the wallpaper's background
;   text                        text       pywal color7
;   button, tab-active          primary    the shell's `primary` (color1, floored at 4.5:1)
;   button-active, selected-row focus      the shell's `focus`   (color4, floored at 4.5:1)
;   shadow                      on-primary what is drawn ON an accent fill (the base)
;   card, notification,         surface, surface-high, surface-container, pre-mixed for the
;   button-disabled             few places Spotify itself still reads those slots
;   subtext                     the dim text colour, as a solid
;
; What follows is only the fallback before the shell has written anything: the monochrome
; ramp the shell itself falls back to when it has no palette.

[Pywal]
text               = FFFFFF
subtext            = A0A0A0
main               = 000000
sidebar            = 000000
player             = 000000
card               = 080808
shadow             = 000000
selected-row       = C0C0C0
button             = D0D0D0
button-active      = C0C0C0
button-disabled    = 1C1C1C
tab-active         = D0D0D0
notification       = 262626
notification-error = D0D0D0
misc               = 000000
